<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Signal perdu · {{ site.name }}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050912">
<link rel="icon" href="{{ base }}assets/img/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:2rem;background:#050912;color:#e9eff8;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:34rem}
svg{width:100%;height:90px;margin-bottom:1.5rem;color:#34d8f5}
path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.code{font:500 .8rem ui-monospace,Consolas,monospace;letter-spacing:.2em;color:#34d8f5;text-transform:uppercase}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.1;margin:.6rem 0 1rem;letter-spacing:-.02em}
p{color:#a3b3c9}
.links{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
a{display:inline-block;padding:.8rem 1.4rem;border-radius:999px;border:1px solid rgba(148,163,184,.3);color:#e9eff8;text-decoration:none;font-weight:600}
a:first-child{background:#34d8f5;border-color:#34d8f5;color:#03121a}
a:hover,a:focus-visible{border-color:#34d8f5;outline:none}
@media (prefers-reduced-motion:reduce){path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 400 90" aria-hidden="true"><path pathLength="1" d="M0 45h70l8-10 8 10h14l6 12 10-50 10 62 7-24h20l10-14 12 14h215"/></svg>
  <p class="code">Erreur 404</p>
  <h1>Signal perdu · Signal lost</h1>
  <p>La page demandée n'existe pas ou a été déplacée.<br><span lang="en">The page you are looking for does not exist or has moved.</span></p>
  <div class="links">
    <a href="{{ base }}">Revenir à l'accueil</a>
    <a href="{{ base }}en/" lang="en">Back to home</a>
  </div>
</main>
</body>
</html>
